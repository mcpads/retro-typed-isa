[workspace]
resolver = "2"
members = [
    "crates/allegrex",
    "crates/arm7tdmi",
    "crates/arm946e-s",
    "crates/expected-write",
    "crates/huc6280",
    "crates/i386",
    "crates/m68000",
    "crates/powerpc-gekko-750cl",
    "crates/psx-r3000a",
    "crates/r5900",
    "crates/rp2a03",
    "crates/sh2",
    "crates/sh4",
    "crates/sm83",
    "crates/tlcs900h",
    "crates/typed-isa-core",
    "crates/v30",
    "crates/v30mz",
    "crates/v810",
    "crates/vr4300",
    "crates/w65c816",
    "crates/z80",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
