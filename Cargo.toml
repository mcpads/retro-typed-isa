[workspace]
resolver = "2"
members = [
    "crates/expected-write",
    "crates/huc6280",
    "crates/m68000",
    "crates/psx-r3000a",
    "crates/rp2a03",
    "crates/sh2",
    "crates/sh4",
    "crates/v30",
    "crates/w65c816",
    "crates/z80",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
